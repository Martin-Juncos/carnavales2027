services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carnavales2027
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - carnavales2027_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carnavales2027"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  carnavales2027_pgdata:
